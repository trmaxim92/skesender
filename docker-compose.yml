services:
  db:
    image: postgres:16-alpine
    container_name: order-elite-db
    environment:
      POSTGRES_USER: orderelite
      POSTGRES_PASSWORD: orderelite
      POSTGRES_DB: orderelite
    ports:
      - "5433:5432"
    volumes:
      - oe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderelite -d orderelite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: order-elite-redis
    ports:
      - "6379:6379"
    volumes:
      - oe_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oe_pgdata:
  oe_redis:
